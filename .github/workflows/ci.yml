name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-lint-build:
    name: Unit tests, lint y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci --prefix backend
      - run: npm test --prefix backend
      - run: npm ci --prefix frontend
      - run: npm run lint --prefix frontend
      - run: npm run build --prefix frontend

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend
      - run: npx playwright install --with-deps chromium

      # Backend en modo desarrollo (endpoints de test) y frontend con Vite, como en local
      - name: Levantar backend y frontend
        run: |
          (cd backend && node --env-file=.env.development server.js > ../backend.log 2>&1 &)
          (cd frontend && npx vite --port 5173 --strictPort > ../frontend.log 2>&1 &)
          for url in http://localhost:3001/api/menu http://localhost:5173; do
            for i in $(seq 1 30); do curl -sf "$url" > /dev/null && break; sleep 1; done
            curl -sf "$url" > /dev/null || { echo "No respondió $url"; cat backend.log frontend.log; exit 1; }
          done

      - run: npx playwright test
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            backend.log
            frontend.log
          retention-days: 7
